# The evals against the real model. Costs money: only Chris starts it
# (Actions → Real-model evals → Run workflow, or `gh workflow run evals-real.yml`).
# It reports the pass rate in the run summary and never fails on a low rate.
name: Real-model evals

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: levelpath
          POSTGRES_USER: levelpath_owner
          POSTGRES_PASSWORD: levelpath_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U levelpath_owner -d levelpath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      API_PORT: 3100
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - name: Start the API on the real model
        env:
          LLM_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          nohup pnpm --filter @levelpath/api start > api.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf "http://localhost:$API_PORT/health" > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "The API did not answer /health within 30 s:"
          cat api.log
          exit 1
      - name: Run the evals
        run: pnpm eval -- --api "http://localhost:$API_PORT" | tee eval.log || true
      - name: Pass rate to the run summary
        if: always()
        run: |
          {
            echo "## Real-model evals"
            echo
            grep -E '^pass rate:' eval.log || echo "No pass rate: the runner did not finish."
            echo
            echo '```'
            cat eval.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
