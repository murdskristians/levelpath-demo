# The checks every PR to main gets. `ci` is the one required check (docs/HARNESS.md, "CI").
# This workflow never reads a secret: fork PRs run it with a read-only token.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which path-filtered jobs apply, from a plain git diff (no third-party action).
  changes:
    runs-on: ubuntu-latest
    outputs:
      harness: ${{ steps.paths.outputs.harness }}
      evals: ${{ steps.paths.outputs.evals }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA"...HEAD)
          printf 'Changed files:\n%s\n' "$files"
          harness=false
          evals=false
          if printf '%s\n' "$files" | grep -Eq '^(\.claude|factory|adws)/'; then harness=true; fi
          if printf '%s\n' "$files" | grep -Eq '^(CLAUDE\.md$|\.claude/|apps/api/src/suggestions/prompt\.ts$|evals/)'; then evals=true; fi
          echo "harness=$harness" >> "$GITHUB_OUTPUT"
          echo "evals=$evals" >> "$GITHUB_OUTPUT"
          echo "harness tests: $harness, mock evals: $evals"

  # The same gate as every driver runs locally: the script itself, not a copy of its steps.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: levelpath
          POSTGRES_USER: levelpath_owner
          POSTGRES_PASSWORD: levelpath_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U levelpath_owner -d levelpath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: bash factory/checks.sh

  harness-tests:
    needs: changes
    if: needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -X utf8 .claude/hooks/test_hooks.py
      - run: python3 -X utf8 factory/tests/run_test.py

  # The evals against the MockProvider: free, and every case must pass.
  mock-evals:
    needs: changes
    if: needs.changes.outputs.evals == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: levelpath
          POSTGRES_USER: levelpath_owner
          POSTGRES_PASSWORD: levelpath_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U levelpath_owner -d levelpath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LLM_PROVIDER: mock
      API_PORT: 3100
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - name: Start the API on the mock
        run: |
          nohup pnpm --filter @levelpath/api start > api.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf "http://localhost:$API_PORT/health" > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "The API did not answer /health within 30 s:"
          cat api.log
          exit 1
      - run: pnpm eval -- --api "http://localhost:$API_PORT" | tee eval.log
      # The runner exits 0 whatever the rate, so the pass count decides.
      - name: Every case passes
        run: |
          total=$(grep -Eo '^[0-9]+ cases against' eval.log | grep -Eo '^[0-9]+' || true)
          passed=$(grep -Eo '^pass rate: [0-9]+/[0-9]+' eval.log | grep -Eo '[0-9]+/' | tr -d / || true)
          if [ -z "$total" ] || [ -z "$passed" ]; then
            echo "eval.log has no case count or pass rate"
            exit 1
          fi
          if [ "$total" -lt 15 ] || [ "$passed" -ne "$total" ]; then
            echo "mock evals: $passed/$total passed; every case (at least 15) must pass"
            exit 1
          fi
          echo "mock evals: $passed/$total passed"
      - if: failure()
        run: cat api.log || true

  # The one required check: red when any job above failed or was cancelled, green when they
  # passed or were skipped (a skipped path-filtered job would otherwise leave a check pending).
  ci:
    needs: [changes, gate, harness-tests, mock-evals]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "job results: $RESULTS"
          if printf '%s' "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "ci: a required job failed or was cancelled"
            exit 1
          fi
