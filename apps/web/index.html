<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Levelpath Demo</title>
    <script>
      // Sets the theme before first paint; same rules as src/theme.ts.
      (function () {
        try {
          var t = null;
          try {
            t = localStorage.getItem('levelpath.theme');
          } catch (e) {
            console.error('theme: cannot read the stored choice', e);
          }
          if (t !== 'light' && t !== 'dark') {
            t =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          console.error('theme: cannot set the theme', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
