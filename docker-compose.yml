services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-levelpath}
      POSTGRES_USER: ${POSTGRES_USER:-levelpath_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-levelpath_dev_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18+ images keep versioned data dirs under /var/lib/postgresql
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
