# One project name for every checkout. Without it, Compose names the project after the
# folder, so `pnpm db:up` in a run's worktree (trees/<id>, .worktrees/<job>) made a second
# Postgres there: it couldn't start while this one holds 5432, and when this one was down
# the run's tests got an empty database of their own. Now every checkout reaches this one.
# `pnpm db:up` never recreates it (--no-recreate), so a branch's copy of this file can't
# replace it; after changing this file, `pnpm db:down && pnpm db:up` applies the change.
name: levelpath-demo

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-levelpath}
      POSTGRES_USER: ${POSTGRES_USER:-levelpath_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-levelpath_dev_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18+ images keep versioned data dirs under /var/lib/postgresql
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
